basePath: /api/v1
definitions:
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.AccountCreateRequest:
    properties:
      account_type:
        enum:
        - CASH_FLOW
        - WALLET
        - BANK
        - CREDIT_CARD
        - SAVINGS
        example: WALLET
        type: string
      description:
        example: Daily allowance wallet
        maxLength: 255
        type: string
      name:
        example: Dompet Harian
        maxLength: 100
        minLength: 2
        type: string
      opening_balance:
        example: "0.00"
        type: string
    required:
    - account_type
    - name
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.AccountResponse:
    properties:
      account_type:
        example: WALLET
        type: string
      created_at:
        type: string
      description:
        example: Daily allowance wallet
        type: string
      id:
        example: 1
        type: integer
      is_active:
        example: true
        type: boolean
      name:
        example: Dompet Harian
        type: string
      opening_balance:
        example: "0.00"
        type: string
      updated_at:
        type: string
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.AccountStatusRequest:
    properties:
      is_active:
        example: false
        type: boolean
    required:
    - is_active
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.AmountLine:
    properties:
      amount:
        example: "1200000.00"
        type: string
      label:
        example: Cicilan Rumah
        type: string
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.BalanceSnapshotRequest:
    properties:
      actual_balance:
        example: "72500.00"
        type: string
      as_of_date:
        example: "2026-09-25"
        type: string
      note:
        example: Counted by hand
        maxLength: 255
        type: string
    required:
    - actual_balance
    - as_of_date
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.BalanceSnapshotResponse:
    properties:
      account_id:
        example: 1
        type: integer
      account_name:
        example: Dompet Harian
        type: string
      actual_balance:
        example: "72500.00"
        type: string
      as_of_date:
        example: "2026-09-25"
        type: string
      created_at:
        type: string
      id:
        example: 1
        type: integer
      note:
        example: Counted by hand
        type: string
      updated_at:
        type: string
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.BankSection:
    properties:
      account_id:
        example: 4
        type: integer
      actual_balance:
        example: "20000.00"
        type: string
      computed:
        description: 'Computed is MoneyIn - Fees - MoneyOut: the day''s own movement.'
        example: "12500.00"
        type: string
      fees:
        description: Fees are direct charges on the account, such as a transfer fee.
        example: "2500.00"
        type: string
      has_actual_balance:
        example: true
        type: boolean
      money_in:
        example: "915000.00"
        type: string
      money_out:
        example: "900000.00"
        type: string
      name:
        example: Bank Utama
        type: string
      previous_balance:
        description: |-
          PreviousBalance is ActualBalance - Computed: what was already sitting there, which is
          why the actual balance is not treated as a deduction from the wallet.
        example: "7500.00"
        type: string
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.CashFlowPoint:
    properties:
      balance:
        example: "15000000.00"
        type: string
      date:
        example: "2026-09-25"
        type: string
      expense:
        example: "0.00"
        type: string
      income:
        example: "15000000.00"
        type: string
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.CashFlowResponse:
    properties:
      net_cash_flow:
        example: "6500000.00"
        type: string
      period:
        $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.Period'
      rows:
        items:
          $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.CashFlowRow'
        type: array
      total_expense:
        example: "8500000.00"
        type: string
      total_income:
        example: "15000000.00"
        type: string
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.CashFlowRow:
    properties:
      balance:
        example: "15000000.00"
        type: string
      category_name:
        example: Salary
        type: string
      description:
        example: Salary September
        type: string
      expense:
        example: "0.00"
        type: string
      income:
        example: "15000000.00"
        type: string
      reference_number:
        example: INV-0001
        type: string
      transaction_date:
        example: "2026-09-25"
        type: string
      transaction_type:
        example: INCOME
        type: string
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.CategoryCreateRequest:
    properties:
      description:
        example: Daily meals
        maxLength: 255
        type: string
      name:
        example: Food
        maxLength: 100
        minLength: 2
        type: string
      type:
        enum:
        - INCOME
        - EXPENSE
        example: EXPENSE
        type: string
    required:
    - name
    - type
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.CategoryResponse:
    properties:
      created_at:
        type: string
      description:
        example: Daily meals
        type: string
      id:
        example: 1
        type: integer
      is_active:
        example: true
        type: boolean
      name:
        example: Food
        type: string
      type:
        example: EXPENSE
        type: string
      updated_at:
        type: string
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.CategoryStatusRequest:
    properties:
      is_active:
        example: false
        type: boolean
    required:
    - is_active
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.CategoryUpdateRequest:
    properties:
      description:
        example: Daily meals
        maxLength: 255
        type: string
      name:
        example: Food
        maxLength: 100
        minLength: 2
        type: string
      type:
        enum:
        - INCOME
        - EXPENSE
        example: EXPENSE
        type: string
    required:
    - name
    - type
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.CreditCardSection:
    properties:
      account_id:
        example: 5
        type: integer
      name:
        example: Bayar tagihan
        type: string
      net:
        example: "850000.00"
        type: string
      payments:
        example: "1750000.00"
        type: string
      taken_back:
        description: TakenBack is money moved off the card into another account, the
          top-up source.
        example: "900000.00"
        type: string
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.DailyCashFlowReport:
    properties:
      banks:
        items:
          $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.BankSection'
        type: array
      cash_flow_expenses:
        items:
          $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.AmountLine'
        type: array
      cash_flow_total:
        example: "5000000.00"
        type: string
      credit_cards:
        items:
          $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.CreditCardSection'
        type: array
      date:
        description: Date is the day the report covers.
        example: "2026-09-25"
        type: string
      date_label:
        description: DateLabel is the short day heading, e.g. "25/09".
        example: 25/09
        type: string
      opening_balance:
        example: "5000000.00"
        type: string
      opening_balance_label:
        example: Saldo Awal Cash Flow
        type: string
      period_label:
        description: PeriodLabel is the month heading, already localised, e.g. "SEPTEMBER
          2026".
        example: SEPTEMBER 2026
        type: string
      reconciliation:
        $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.ReconciliationSection'
      status:
        items:
          $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.StatusLine'
        type: array
      top_up:
        $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.TopUpSection'
      wallets:
        items:
          $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.WalletSection'
        type: array
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.DashboardSummaryResponse:
    properties:
      balance:
        example: "6500000.00"
        type: string
      cash_flow_trend:
        items:
          $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.CashFlowPoint'
        type: array
      expense_by_category:
        items:
          $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.ExpenseByCategoryRow'
        type: array
      income_vs_expense:
        items:
          $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.IncomeVsExpensePoint'
        type: array
      period:
        $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.Period'
      recent_transactions:
        items:
          $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.TransactionResponse'
        type: array
      total_expense:
        example: "8500000.00"
        type: string
      total_income:
        example: "15000000.00"
        type: string
      transaction_count:
        example: 125
        type: integer
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.ExpenseByCategoryResponse:
    properties:
      period:
        $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.Period'
      rows:
        items:
          $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.ExpenseByCategoryRow'
        type: array
      total:
        example: "8500000.00"
        type: string
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.ExpenseByCategoryRow:
    properties:
      category_id:
        example: 5
        type: integer
      category_name:
        example: Cicilan Rumah
        type: string
      percentage:
        example: "13.53"
        type: string
      total:
        example: "1150000.00"
        type: string
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.IncomeVsExpensePoint:
    properties:
      expense:
        example: "8500000.00"
        type: string
      income:
        example: "15000000.00"
        type: string
      label:
        example: 2026-09
        type: string
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.LoginRequest:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: Admin123!
        type: string
    required:
    - email
    - password
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.LoginResponse:
    properties:
      access_token:
        type: string
      expires_at:
        type: string
      token_type:
        example: Bearer
        type: string
      user:
        $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.UserResponse'
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.MonthlyResponse:
    properties:
      period:
        $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.Period'
      rows:
        items:
          $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.MonthlyRow'
        type: array
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.MonthlyRow:
    properties:
      expense:
        example: "8500000.00"
        type: string
      income:
        example: "15000000.00"
        type: string
      month:
        example: 2026-09
        type: string
      net_cash_flow:
        example: "6500000.00"
        type: string
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.Period:
    properties:
      from:
        example: "2026-09-01"
        type: string
      to:
        example: "2026-09-30"
        type: string
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.ReconciliationSection:
    properties:
      balanced:
        example: true
        type: boolean
      difference:
        example: "0.00"
        type: string
      parts:
        items:
          $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.AmountLine'
        type: array
      parts_total:
        example: "900000.00"
        type: string
      top_up_total:
        example: "900000.00"
        type: string
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.RegisterRequest:
    properties:
      email:
        example: user@example.com
        maxLength: 255
        type: string
      name:
        example: John Doe
        maxLength: 150
        minLength: 2
        type: string
      password:
        example: Admin123!
        maxLength: 72
        type: string
    required:
    - email
    - name
    - password
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.StatusLine:
    properties:
      amount:
        example: "900000.00"
        type: string
      icon:
        example: "\U0001F4B0"
        type: string
      label:
        example: Top-up
        type: string
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.SummaryResponse:
    properties:
      net_cash_flow:
        example: "6500000.00"
        type: string
      period:
        $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.Period'
      total_expense:
        example: "8500000.00"
        type: string
      total_income:
        example: "15000000.00"
        type: string
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.TelegramLinkResponse:
    properties:
      chat_id:
        example: 123456789
        type: integer
      chat_title:
        example: Reza
        type: string
      linked:
        example: true
        type: boolean
      linked_at:
        type: string
      username:
        example: rezani
        type: string
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.TelegramPairingCodeResponse:
    properties:
      bot_username:
        description: BotUsername is empty when the bot token could not be reached.
        example: rezanibot
        type: string
      code:
        example: 7F3K9Q
        type: string
      deep_link:
        description: |-
          DeepLink opens the chat and sends "/start <code>" on a single tap, so nothing has to be
          typed. It is empty when the bot username is unknown, and the UI then falls back to
          showing the code.
        example: https://t.me/rezanibot?start=7F3K9Q
        type: string
      expires_at:
        type: string
      instruction:
        description: |-
          Instruction is ready to show in the UI so the user does not have to be told the
          command format separately.
        example: Send /start 7F3K9Q to the bot
        type: string
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.TelegramSendResponse:
    properties:
      characters:
        description: |-
          Characters is the rendered length before splitting, useful when a report grows near
          the 4096-character limit.
        example: 2480
        type: integer
      chat_id:
        example: 123456789
        type: integer
      messages:
        example: 1
        type: integer
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.TopUpSection:
    properties:
      allocation_total:
        description: AllocationTotal sums Allocations; when it equals Total the section
          is balanced.
        example: "900000.00"
        type: string
      allocations:
        items:
          $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.AmountLine'
        type: array
      balanced:
        example: true
        type: boolean
      total:
        example: "900000.00"
        type: string
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.TransactionCreateRequest:
    properties:
      account_id:
        description: |-
          AccountID is where the money moved. It is optional; a transaction without one is
          treated as cash flow.
        example: 1
        type: integer
      amount:
        example: "1200000.00"
        type: string
      category_id:
        example: 5
        type: integer
      description:
        example: Cicilan Rumah
        maxLength: 500
        type: string
      parent_id:
        description: |-
          ParentID makes this row a detail line of another transaction, so the parent's amount
          is reported once and its parts are still visible.
        example: 12
        type: integer
      reference_number:
        example: INV-0001
        maxLength: 100
        type: string
      to_account_id:
        description: ToAccountID is the other side of a transfer and is only allowed
          on a TRANSFER.
        example: 3
        type: integer
      transaction_date:
        example: "2026-09-25"
        type: string
      transaction_type:
        enum:
        - INCOME
        - EXPENSE
        - TRANSFER
        example: EXPENSE
        type: string
    required:
    - amount
    - transaction_date
    - transaction_type
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.TransactionResponse:
    properties:
      account_id:
        example: 1
        type: integer
      account_name:
        example: Cash Flow
        type: string
      amount:
        example: "1200000.00"
        type: string
      category_id:
        example: 5
        type: integer
      category_name:
        example: Cicilan Rumah
        type: string
      created_at:
        type: string
      description:
        example: Cicilan Rumah
        type: string
      id:
        example: 1
        type: integer
      parent_id:
        example: 12
        type: integer
      reference_number:
        example: INV-0001
        type: string
      to_account_id:
        example: 3
        type: integer
      to_account_name:
        example: Dompet Harian
        type: string
      transaction_date:
        example: "2026-09-25"
        type: string
      transaction_type:
        example: EXPENSE
        type: string
      updated_at:
        type: string
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.UserResponse:
    properties:
      created_at:
        type: string
      email:
        example: user@example.com
        type: string
      id:
        example: 1
        type: integer
      is_active:
        example: true
        type: boolean
      name:
        example: John Doe
        type: string
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.WalletItem:
    properties:
      amount:
        example: "100000.00"
        type: string
      label:
        example: Tarik Tunai
        type: string
      sub_items:
        items:
          $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.AmountLine'
        type: array
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.WalletSection:
    properties:
      account_id:
        example: 3
        type: integer
      actual_balance:
        example: "72500.00"
        type: string
      allotment:
        description: Allotment is the total topped up into this wallet on the report
          date.
        example: "600000.00"
        type: string
      expected_remaining:
        description: 'ExpectedRemaining is Allotment - RecordedTotal: what should
          still be there.'
        example: "100000.00"
        type: string
      has_actual_balance:
        description: |-
          HasActualBalance is false when nobody counted the wallet, in which case the report
          stops at ExpectedRemaining instead of inventing a variance.
        example: true
        type: boolean
      items:
        items:
          $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.WalletItem'
        type: array
      name:
        example: Dompet Harian
        type: string
      recorded_total:
        description: RecordedTotal sums Items, counting a parent once and never its
          children.
        example: "500000.00"
        type: string
      variance:
        description: 'Variance is ExpectedRemaining - ActualBalance: spending that
          was never written down.'
        example: "27500.00"
        type: string
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_utils.Envelope:
    properties:
      data: {}
      errors:
        additionalProperties:
          type: string
        type: object
      message:
        type: string
      success:
        type: boolean
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_utils.PagedData:
    properties:
      items: {}
      pagination:
        $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_utils.Pagination'
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_utils.Pagination:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      total_items:
        type: integer
      total_pages:
        type: integer
    type: object
info:
  contact: {}
  description: 'Personal finance tracking: transactions, categories, dashboard and
    cash flow reports.'
  title: Financial Management API
  version: "1.0"
paths:
  /accounts:
    get:
      parameters:
      - description: CASH_FLOW, WALLET, BANK, CREDIT_CARD or SAVINGS
        in: query
        name: account_type
        type: string
      - description: Filter by active flag
        in: query
        name: is_active
        type: boolean
      - description: Match name or description
        in: query
        name: search
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Rows per page, max 100
        in: query
        name: page_size
        type: integer
      - description: name, account_type, opening_balance or created_at
        in: query
        name: sort_by
        type: string
      - description: asc or desc
        in: query
        name: sort_dir
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_utils.Envelope'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_utils.PagedData'
                  - properties:
                      items:
                        items:
                          $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.AccountResponse'
                        type: array
                    type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_utils.Envelope'
      security:
      - BearerAuth: []
      summary: List accounts
      tags:
      - Accounts
    post:
      consumes:
      - application/json
      parameters:
      - description: Account
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.AccountCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
