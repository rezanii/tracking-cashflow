basePath: /api/v1
definitions:
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.CashFlowPoint:
    properties:
      balance:
        example: "15000000.00"
        type: string
      date:
        example: "2026-09-25"
        type: string
      expense:
        example: "0.00"
        type: string
      income:
        example: "15000000.00"
        type: string
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.CashFlowResponse:
    properties:
      net_cash_flow:
        example: "6500000.00"
        type: string
      period:
        $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.Period'
      rows:
        items:
          $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.CashFlowRow'
        type: array
      total_expense:
        example: "8500000.00"
        type: string
      total_income:
        example: "15000000.00"
        type: string
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.CashFlowRow:
    properties:
      balance:
        example: "15000000.00"
        type: string
      category_name:
        example: Salary
        type: string
      description:
        example: Salary September
        type: string
      expense:
        example: "0.00"
        type: string
      income:
        example: "15000000.00"
        type: string
      reference_number:
        example: INV-0001
        type: string
      transaction_date:
        example: "2026-09-25"
        type: string
      transaction_type:
        example: INCOME
        type: string
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.CategoryCreateRequest:
    properties:
      description:
        example: Daily meals
        maxLength: 255
        type: string
      name:
        example: Food
        maxLength: 100
        minLength: 2
        type: string
      type:
        enum:
        - INCOME
        - EXPENSE
        example: EXPENSE
        type: string
    required:
    - name
    - type
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.CategoryResponse:
    properties:
      created_at:
        type: string
      description:
        example: Daily meals
        type: string
      id:
        example: 1
        type: integer
      is_active:
        example: true
        type: boolean
      name:
        example: Food
        type: string
      type:
        example: EXPENSE
        type: string
      updated_at:
        type: string
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.CategoryStatusRequest:
    properties:
      is_active:
        example: false
        type: boolean
    required:
    - is_active
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.CategoryUpdateRequest:
    properties:
      description:
        example: Daily meals
        maxLength: 255
        type: string
      name:
        example: Food
        maxLength: 100
        minLength: 2
        type: string
      type:
        enum:
        - INCOME
        - EXPENSE
        example: EXPENSE
        type: string
    required:
    - name
    - type
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.DashboardSummaryResponse:
    properties:
      balance:
        example: "6500000.00"
        type: string
      cash_flow_trend:
        items:
          $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.CashFlowPoint'
        type: array
      expense_by_category:
        items:
          $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.ExpenseByCategoryRow'
        type: array
      income_vs_expense:
        items:
          $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.IncomeVsExpensePoint'
        type: array
      period:
        $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.Period'
      recent_transactions:
        items:
          $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.TransactionResponse'
        type: array
      total_expense:
        example: "8500000.00"
        type: string
      total_income:
        example: "15000000.00"
        type: string
      transaction_count:
        example: 125
        type: integer
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.ExpenseByCategoryResponse:
    properties:
      period:
        $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.Period'
      rows:
        items:
          $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.ExpenseByCategoryRow'
        type: array
      total:
        example: "8500000.00"
        type: string
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.ExpenseByCategoryRow:
    properties:
      category_id:
        example: 5
        type: integer
      category_name:
        example: Cicilan Rumah
        type: string
      percentage:
        example: "13.53"
        type: string
      total:
        example: "1150000.00"
        type: string
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.IncomeVsExpensePoint:
    properties:
      expense:
        example: "8500000.00"
        type: string
      income:
        example: "15000000.00"
        type: string
      label:
        example: 2026-09
        type: string
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.LoginRequest:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: Admin123!
        type: string
    required:
    - email
    - password
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.LoginResponse:
    properties:
      access_token:
        type: string
      expires_at:
        type: string
      token_type:
        example: Bearer
        type: string
      user:
        $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.UserResponse'
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.MonthlyResponse:
    properties:
      period:
        $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.Period'
      rows:
        items:
          $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.MonthlyRow'
        type: array
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.MonthlyRow:
    properties:
      expense:
        example: "8500000.00"
        type: string
      income:
        example: "15000000.00"
        type: string
      month:
        example: 2026-09
        type: string
      net_cash_flow:
        example: "6500000.00"
        type: string
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.Period:
    properties:
      from:
        example: "2026-09-01"
        type: string
      to:
        example: "2026-09-30"
        type: string
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.RegisterRequest:
    properties:
      email:
        example: user@example.com
        maxLength: 255
        type: string
      name:
        example: John Doe
        maxLength: 150
        minLength: 2
        type: string
      password:
        example: Admin123!
        maxLength: 72
        type: string
    required:
    - email
    - name
    - password
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.SummaryResponse:
    properties:
      net_cash_flow:
        example: "6500000.00"
        type: string
      period:
        $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.Period'
      total_expense:
        example: "8500000.00"
        type: string
      total_income:
        example: "15000000.00"
        type: string
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.TransactionCreateRequest:
    properties:
      amount:
        example: "1150000.00"
        type: string
      category_id:
        example: 5
        type: integer
      description:
        example: Cicilan Rumah September
        maxLength: 500
        type: string
      reference_number:
        example: INV-0001
        maxLength: 100
        type: string
      transaction_date:
        example: "2026-09-25"
        type: string
      transaction_type:
        enum:
        - INCOME
        - EXPENSE
        - TRANSFER
        example: EXPENSE
        type: string
    required:
    - amount
    - transaction_date
    - transaction_type
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.TransactionResponse:
    properties:
      amount:
        example: "1150000.00"
        type: string
      category_id:
        example: 5
        type: integer
      category_name:
        example: Cicilan Rumah
        type: string
      created_at:
        type: string
      description:
        example: Cicilan Rumah September
        type: string
      id:
        example: 1
        type: integer
      reference_number:
        example: INV-0001
        type: string
      transaction_date:
        example: "2026-09-25"
        type: string
      transaction_type:
        example: EXPENSE
        type: string
      updated_at:
        type: string
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.UserResponse:
    properties:
      created_at:
        type: string
      email:
        example: user@example.com
        type: string
      id:
        example: 1
        type: integer
      is_active:
        example: true
        type: boolean
      name:
        example: John Doe
        type: string
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_utils.Envelope:
    properties:
      data: {}
      errors:
        additionalProperties:
          type: string
        type: object
      message:
        type: string
      success:
        type: boolean
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_utils.PagedData:
    properties:
      items: {}
      pagination:
        $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_utils.Pagination'
    type: object
  github_com_rezanii_tracking-cashflow_apps_backend_internal_utils.Pagination:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      total_items:
        type: integer
      total_pages:
        type: integer
    type: object
info:
  contact: {}
  description: 'Personal finance tracking: transactions, categories, dashboard and
    cash flow reports.'
  title: Financial Management API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_utils.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.LoginResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_utils.Envelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_utils.Envelope'
      summary: Log in
      tags:
      - Auth
  /auth/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_utils.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_utils.Envelope'
      security:
      - BearerAuth: []
      summary: Log out
      tags:
      - Auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_utils.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.UserResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_utils.Envelope'
      security:
      - BearerAuth: []
      summary: Current user
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Registration payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_utils.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.UserResponse'
              type: object
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_utils.Envelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_utils.Envelope'
      summary: Register a new user
      tags:
      - Auth
  /categories:
    get:
      parameters:
      - description: INCOME or EXPENSE
        in: query
        name: type
        type: string
      - description: Filter by active flag
        in: query
        name: is_active
        type: boolean
      - description: Match name or description
        in: query
        name: search
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Rows per page, max 100
        in: query
        name: page_size
        type: integer
      - description: name, type or created_at
        in: query
        name: sort_by
        type: string
      - description: asc or desc
        in: query
        name: sort_dir
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_utils.Envelope'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_utils.PagedData'
                  - properties:
                      items:
                        items:
                          $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.CategoryResponse'
                        type: array
                    type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_utils.Envelope'
      security:
      - BearerAuth: []
      summary: List categories
      tags:
      - Categories
    post:
      consumes:
      - application/json
      parameters:
      - description: Category payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.CategoryCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_utils.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.CategoryResponse'
              type: object
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_utils.Envelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_utils.Envelope'
      security:
      - BearerAuth: []
      summary: Create category
      tags:
      - Categories
  /categories/{id}:
    delete:
      parameters:
      - description: Category id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_utils.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_utils.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_utils.Envelope'
      security:
      - BearerAuth: []
      summary: Delete category
      tags:
      - Categories
    get:
      parameters:
      - description: Category id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_utils.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.CategoryResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_utils.Envelope'
      security:
      - BearerAuth: []
      summary: Get category
      tags:
      - Categories
    put:
      consumes:
      - application/json
      parameters:
      - description: Category id
        in: path
        name: id
        required: true
        type: integer
      - description: Category payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.CategoryUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_utils.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.CategoryResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_utils.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_utils.Envelope'
      security:
      - BearerAuth: []
      summary: Update category
      tags:
      - Categories
  /categories/{id}/status:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Category id
        in: path
        name: id
        required: true
        type: integer
      - description: Status payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.CategoryStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_utils.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.CategoryResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_utils.Envelope'
      security:
      - BearerAuth: []
      summary: Activate or deactivate category
      tags:
      - Categories
  /dashboard/summary:
    get:
      parameters:
      - default: month
        description: today, week, month, year or custom
        in: query
        name: range
        type: string
      - description: Required when range is custom
        in: query
        name: date_from
        type: string
      - description: Required when range is custom
        in: query
        name: date_to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_utils.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.DashboardSummaryResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_utils.Envelope'
      security:
      - BearerAuth: []
      summary: Dashboard summary
      tags:
      - Reports
  /reports/cash-flow:
    get:
      parameters:
      - description: Start date, YYYY-MM-DD
        in: query
        name: date_from
        required: true
        type: string
      - description: End date, YYYY-MM-DD
        in: query
        name: date_to
        required: true
        type: string
      - description: Category id
        in: query
        name: category_id
        type: integer
      - description: INCOME, EXPENSE or TRANSFER
        in: query
        name: transaction_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_utils.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_dto.CashFlowResponse'
              type: object
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_utils.Envelope'
      security:
      - BearerAuth: []
      summary: Cash flow report
      tags:
      - Reports
  /reports/cash-flow/excel:
    get:
      parameters:
      - description: Start date, YYYY-MM-DD
        in: query
        name: date_from
        required: true
        type: string
      - description: End date, YYYY-MM-DD
        in: query
        name: date_to
        required: true
        type: string
      - description: Category id
        in: query
        name: category_id
        type: integer
      - description: INCOME, EXPENSE or TRANSFER
        in: query
        name: transaction_type
        type: string
      produces:
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      responses:
        "200":
          description: OK
          schema:
            type: file
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_rezanii_tracking-cashflow_apps_backend_internal_utils.Envelope'
      security:
      - BearerAuth: []
      summary: Cash flow report as Excel
      tags:
      - Reports
  /reports/cash-flow/pdf:
    get:
      parameters:
      - description: Start date, YYYY-MM-DD
        in: query
        name: date_from
        required: true
        type: string
      - description: End date, YYYY-MM-DD
        in: query
        name: date_to
        required: true
        type: string
      - description: Category id
        in: query
        name: category_id
        type: integer
      - description: INCOME, EXPENSE or TRANSFER
        in: query
        name: transaction_type
        type: string
      produces:
      - application/pdf
      responses:
        "200":
          description: OK
