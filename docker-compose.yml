services:
  postgres:
    image: postgres:17-alpine
    container_name: tracking-cashflow-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      # The app database is created by the migrator, which also handles a hosted Postgres
      # where CREATE DATABASE is not ours to run at startup.
      POSTGRES_DB: postgres
    ports:
      # Published on POSTGRES_HOST_PORT so a Postgres already installed on the host can keep
      # 5432. Inside the network the port is always 5432.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready reports the server is accepting connections, not merely that the port opened.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # Creates the database, applies the schema and loads development data, then exits.
  # The backend waits for it so a first start comes up against a ready schema.
  migrate:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: tools
    container_name: tracking-cashflow-migrate
    environment:
      APP_ENV: ${APP_ENV:-development}
      # Defaults to the bundled service. Set DB_HOST_DOCKER to host.docker.internal to use a
      # Postgres running on the host, or to a hosted one (Neon, Supabase, Render).
      DB_HOST: ${DB_HOST_DOCKER:-postgres}
      DB_PORT: ${DB_PORT_DOCKER:-5432}
      DB_SSLMODE: disable
      DB_USER: ${DB_USER:-sa}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-financial_management}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/app/entrypoint.sh"]
    restart: "no"

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: tracking-cashflow-backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8080
      # Defaults to the bundled service. Set DB_HOST_DOCKER to host.docker.internal to use a
      # Postgres running on the host, or to a hosted one (Neon, Supabase, Render).
      DB_HOST: ${DB_HOST_DOCKER:-postgres}
      DB_PORT: ${DB_PORT_DOCKER:-5432}
      DB_SSLMODE: disable
      DB_USER: ${DB_USER:-sa}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-financial_management}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # The bot is off unless a mode and a token are set, so the stack starts without them.
      TELEGRAM_MODE: ${TELEGRAM_MODE:-off}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      TELEGRAM_PAIRING_CODE_TTL: ${TELEGRAM_PAIRING_CODE_TTL:-15m}
    ports:
      # Published on APP_HOST_PORT so a port already in use on the host can be avoided.
      - "${APP_HOST_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/api", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        # Baked in at build time because Next.js inlines NEXT_PUBLIC_* into the bundle.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    container_name: tracking-cashflow-frontend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
