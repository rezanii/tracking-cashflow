# Render blueprint for the Go API. The frontend is not here: it goes to Netlify, which
# netlify.toml configures.
#
# Render is used rather than Netlify or Vercel for this half because the API needs a process
# that stays alive — the Telegram poller holds a long poll open for the life of the process,
# which a short-lived function cannot do.
services:
  - type: web
    name: tracking-cashflow-api
    runtime: docker
    # Singapore, to sit next to the Neon project in ap-southeast-1.
    region: singapore
    plan: free
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: ./apps/backend
    # The image has no curl, so the binary probes itself; this is the HTTP check Render uses.
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production

      # APP_PORT is deliberately not set: Render injects PORT and routes traffic to it, and the
      # config falls back to PORT when APP_PORT is absent.

      # Set in the Render dashboard, not here: a connection string is a secret.
      # Use the POOLED Neon URL for the running API. Migrations use the unpooled one and are
      # applied out of band (see docs/README.md §14) because DDL through a transaction-mode
      # pooler can misbehave.
      - key: DATABASE_URL
        sync: false

      - key: DB_SSLMODE
        value: require

      # Generated once by Render and kept. Rotating it invalidates every issued token.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 24h

      # Must name the real frontend origin, or the browser rejects every request from it.
      # Set it to the Netlify domain after the site exists.
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # webhook rather than polling: a free Render service spins down when idle, which stops a
      # poller dead, while Telegram simply retries a webhook. Leave TELEGRAM_MODE as off until
      # the token and secret are set.
      - key: TELEGRAM_MODE
        value: "off"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        sync: false
